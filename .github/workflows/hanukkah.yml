name: hanukkah-story
on: workflow_dispatch
permissions:
  contents: write
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q edge-tts
      - name: narrate
        run: python hanukkah_story.py
      - name: commit
        run: |
          git config user.name taldro-bot
          git config user.email taldro-bot@users.noreply.github.com
          git add media/hanukkah/narrated
          git commit -m "hanukkah narrated videos (oil-jar story) [skip ci]" || exit 0
          git pull --rebase && git push
