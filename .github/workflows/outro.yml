name: brand-outro
on:
  workflow_dispatch:
    inputs:
      src: { description: 'input film (repo path)', default: 'media/dreamina/films/crane-30s-he.mp4' }
      dst: { description: 'output film (repo path)', default: 'media/dreamina/films/crane-30s-he-tal.mp4' }
permissions:
  contents: write
jobs:
  outro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q edge-tts
      - run: python tools/brand_outro.py "${{ inputs.src }}" "${{ inputs.dst }}"
      - run: |
          git config user.name ofek-bot && git config user.email bot@users.noreply.github.com
          git add "${{ inputs.dst }}" && git commit -qm "brand outro: ${{ inputs.dst }}" && git pull -q --rebase && git push -q
