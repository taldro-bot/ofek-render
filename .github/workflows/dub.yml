name: dub-render
on:
  schedule:
    - cron: '41 */2 * * *'   # every 2h: render jobs whose Soniox dub is ready (21.11: 20 machines in parallel)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: dub, cancel-in-progress: false }
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env: { DUB_MANIFEST: '1_B5Pi1slRJdU0kNlJg8oUNIyshelL6RH', MAXN: '40' }
        run: |
          python3 dubrender.py > ids.txt || true
          cat ids.txt
          mkdir -p /tmp/dj && for id in $(cat ids.txt); do cp jobs/$id.json /tmp/dj/; done
          echo "ids=$(python3 -c 'import json;print(json.dumps(open("ids.txt").read().split() or ["none"]))')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with: { name: dubjobs, path: /tmp/dj, if-no-files-found: ignore, retention-days: 2 }
  render:
    needs: pick
    if: needs.pick.outputs.ids != '["none"]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJson(needs.pick.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dubjobs, path: jobs }
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          pip install -q edge-tts pillow
      - name: render
        run: |
          mkdir -p out; id=${{ matrix.id }}; j=jobs/$id.json
          if grep -q '"typewriter": true' "$j"; then python3 typewriter.py --job "$j" < /dev/null
          elif grep -q '"clipmix": true' "$j"; then python3 clipmix.py --job "$j" < /dev/null
          else python3 fetch_photos.py "$j" < /dev/null && { python3 render.py "$j.local" < /dev/null || python3 render.py "$j.local" < /dev/null; }; fi
          ls out/$id.mp4
          [ -f out/$id.json ] || cp $j out/
      - name: publish to out branch
        run: |
          git config user.name "ofek-bot"; git config user.email "bot@tal83.com"
          mkdir -p /tmp/o && cp out/* /tmp/o/
          git fetch -q origin out:out && git checkout -q out
          for i in $(seq 1 12); do
            git fetch -q origin out && git reset -q --hard origin/out
            mkdir -p videos && cp /tmp/o/* videos/
            grep -qx "${{ matrix.id }}" upload.txt 2>/dev/null || echo "${{ matrix.id }}" >> upload.txt
            git add videos upload.txt && git commit -qm "publish ${{ matrix.id }}" && git push -q origin out && break
            sleep $((RANDOM % 30 + 5))
          done
  save:
    needs: [pick, render]
    if: always() && needs.pick.outputs.ids != '["none"]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: mark rendered ids as dubbed (only those that reached the out branch)
        run: |
          git config user.name "ofek-bot"; git config user.email "bot@tal83.com"
          echo '${{ needs.pick.outputs.ids }}' | python3 -c 'import json,sys;print("\n".join(json.load(sys.stdin)))' > /tmp/picked.txt
          for i in $(seq 1 8); do
            git fetch -q origin main out && git checkout -q -f -B main origin/main
            git show origin/out:upload.txt > /tmp/up.txt
            grep -xFf /tmp/up.txt /tmp/picked.txt | grep -vxFf state/dubbed.txt >> state/dubbed.txt || true
            git add state && git commit -qm "dub $(date +%F-%H)" && git push -q origin HEAD:main && break
            git diff --quiet HEAD origin/main && break
            sleep $((RANDOM % 20 + 5))
          done
