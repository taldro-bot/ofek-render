name: typewriter-machine
on:
  schedule:
    - cron: '17 6 */3 * *'   # every 3 days – a new "Tal tells" job (dubbed with the male Soniox voice, rendered by dub.yml)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 typewriter.py new
          git config user.name ofek-bot; git config user.email bot@tal83.com
          for i in 1 2 3 4 5; do git add jobs state && git commit -qm "diary job" && git push -q && break; git pull -q --rebase; done
